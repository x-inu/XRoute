services:
  xroute:
    build: .
    container_name: xroute
    ports:
      - "20130:20130"
    volumes:
      - xroute-data:/data
    environment:
      - PORT=20130
      - DATA_DIR=/data
      # Token saver toggles (all default off except RTK):
      # - RTK_ENABLED=true
      # - CAVEMAN_ENABLED=false
      # - PONYTAIL_ENABLED=false
      # Or use DB_PATH for custom SQLite location:
      # - DB_PATH=/data/custom/data.sqlite
    restart: unless-stopped

volumes:
  xroute-data:
